name: Test

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    coverage: pcov
                    ini-values: pcov.enabled=0, zend.assertions=1

            -   uses: ramsey/composer-install@v3

            -   name: Unit tests
                run: mkdir -p tmp && composer test:unit

            -   name: Example parsers
                run: composer test:examples

            -   name: Documentation examples
                run: composer test:docs

            -   name: Code coverage
                run: composer test:coverage

            -   name: Benchmarks
                run: composer bench

    nom:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5

            -   uses: dtolnay/rust-toolchain@stable

            -   uses: Swatinem/rust-cache@v2
                with:
                    workspaces: benchmarks/nom

            -   name: Benchmarks against nom
                run: cargo test --benches --manifest-path benchmarks/nom/Cargo.toml
