name: Test

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    coverage: pcov
                    ini-values: pcov.enabled=0

            -   uses: ramsey/composer-install@v3

            -   name: Unit tests
                run: mkdir -p tmp && composer ut -- --testsuite Unit

            -   name: Example parsers
                run: composer ut -- --testsuite Examples

            -   name: Documentation examples
                run: composer ut -- --testsuite Documentation

            -   name: Code coverage
                run: composer cov

            -   name: Benchmarks
                run: composer bm
