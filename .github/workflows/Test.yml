name: Test

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    coverage: pcov

            -   uses: ramsey/composer-install@v3

            -   name: Unit tests
                run: mkdir -p tmp && composer ut

            -   name: Mutation tests
                run: composer mt

            -   name: Benchmarks
                run: composer bm
